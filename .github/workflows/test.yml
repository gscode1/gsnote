name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # pip equivalent of README "Develop" (uv sync --extra dev && uv run pytest)
      - run: pip install -e ".[dev]"
      - run: pytest
