name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        # native runners, no QEMU; arm runner is free on public repos
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push (${{ matrix.arch }})
        run: |
          docker build -t "${IMAGE}:${{ matrix.arch }}-${GITHUB_SHA}" .
          docker push "${IMAGE}:${{ matrix.arch }}-${GITHUB_SHA}"

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Merge multi-arch tags
        run: |
          for tag in "${GITHUB_SHA}" latest; do
            docker manifest create "${IMAGE}:${tag}" \
              "${IMAGE}:amd64-${GITHUB_SHA}" \
              "${IMAGE}:arm64-${GITHUB_SHA}"
            docker manifest push "${IMAGE}:${tag}"
          done
