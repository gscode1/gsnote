name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: registry.gskode.com/gsnote
  DOCKER_BUILDKIT: "0" # cluster runner has no BuildKit; classic builder needs explicit --build-arg below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Detect architecture
        id: arch
        run: |
          case "$(uname -m)" in
            aarch64) echo "TARGETARCH=arm64" >> "$GITHUB_OUTPUT" ;;
            x86_64)  echo "TARGETARCH=amd64" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported arch: $(uname -m)"; exit 1 ;;
          esac

      - name: Log in to registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.gskode.com -u gs --password-stdin

      - name: Build image
        run: |
          docker build \
            --build-arg TARGETARCH=${{ steps.arch.outputs.TARGETARCH }} \
            -t "${IMAGE}:${{ steps.arch.outputs.TARGETARCH }}-${{ gitea.sha }}" \
            -t "${IMAGE}:${{ steps.arch.outputs.TARGETARCH }}-latest" \
            .

      - name: Push image
        run: |
          docker push "${IMAGE}:${{ steps.arch.outputs.TARGETARCH }}-${{ gitea.sha }}"
          docker push "${IMAGE}:${{ steps.arch.outputs.TARGETARCH }}-latest"
