[project]
name = "gsnote"
version = "0.1.0"
description = "Self-hosted notes memory with hybrid search"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
gsnote = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
