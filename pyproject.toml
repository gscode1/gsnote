[project]
name = "gsnote"
version = "0.1.0"
description = "Note-first memory agent with hybrid search and proactive resurfacing"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pydantic-ai>=2.0",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4.2",
    "apscheduler>=3.10",
    "python-telegram-bot>=21.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "slack-bolt>=1.30.0",
    "aiohttp>=3.14.3",
]

[project.scripts]
gsnote = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pydantic-evals>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
